<?xml version="1.0" encoding="UTF-8"?>
<!-- Ikona 1: Klasyczna drukarka z dokumentem PDF -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f0f8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Tło ikony - zaokrąglony kwadrat -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48"
        fill="url(#printerGrad)" />

  <!-- Papier wychodzący na dół -->
  <rect x="88" y="158" width="80" height="70" rx="4" ry="4"
        fill="url(#paperGrad)" stroke="#c0cfe0" stroke-width="2"/>
  <!-- Linie tekstu na papierze -->
  <line x1="102" y1="178" x2="154" y2="178" stroke="#aabbcc" stroke-width="3" stroke-linecap="round"/>
  <line x1="102" y1="190" x2="154" y2="190" stroke="#aabbcc" stroke-width="3" stroke-linecap="round"/>
  <line x1="102" y1="202" x2="138" y2="202" stroke="#aabbcc" stroke-width="3" stroke-linecap="round"/>

  <!-- Korpus drukarki -->
  <rect x="52" y="110" width="152" height="72" rx="14" ry="14"
        fill="white" fill-opacity="0.18" stroke="white" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Szczelina podajnika (papier wchodzi) -->
  <rect x="84" y="100" width="88" height="18" rx="4" ry="4"
        fill="white" fill-opacity="0.5"/>

  <!-- Papier wchodzący (górny, delikatnie widoczny) -->
  <rect x="95" y="72" width="66" height="32" rx="3" ry="3"
        fill="url(#paperGrad)" stroke="#c0cfe0" stroke-width="1.5"/>

  <!-- Napis PDF na górnym papierze -->
  <text x="128" y="95" font-family="Arial, sans-serif" font-weight="bold"
        font-size="16" fill="#2563a8" text-anchor="middle">PDF</text>

  <!-- Podświetlenie przycisku na drukarce -->
  <circle cx="175" cy="146" r="8" fill="#4ade80" fill-opacity="0.9"/>

  <!-- Szczelina wyjścia w drukarce -->
  <rect x="80" y="158" width="96" height="6" rx="3" ry="3"
        fill="white" fill-opacity="0.3"/>
</svg>
